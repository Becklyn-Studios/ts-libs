packages:
  - docs
  - packages/*

# Supply-chain protection: only resolve versions that have been public for at least 7 days (in minutes).
minimumReleaseAge: 10080

# Dependency build scripts stay disabled (as with the former `ignore-scripts=true`).
allowBuilds:
  '@parcel/watcher': false
  esbuild: false
minimumReleaseAgeExclude:
  # Renovate security update: vitest@4.1.11
  - vitest@4.1.11

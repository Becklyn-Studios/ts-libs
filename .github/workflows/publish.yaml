name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  id-token: write  # Required for OIDC
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      # No `registry-url` here: it would write an `_authToken=${NODE_AUTH_TOKEN}` placeholder
      # into .npmrc, which interferes with npm trusted publishing (OIDC).
      - name: Setup Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'

      # No store cache in the publishing job: it runs with `id-token: write`, so it
      # should only use freshly downloaded, integrity-checked packages.
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: false

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm run release
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

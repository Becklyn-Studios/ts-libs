name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  id-token: write  # Required for OIDC
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      # No `registry-url` here: it would write an `_authToken=${NODE_AUTH_TOKEN}` placeholder
      # into .npmrc, which interferes with npm trusted publishing (OIDC).
      - name: Setup Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # No store cache in the publishing job: it runs with `id-token: write`, so it
      # should only use freshly downloaded, integrity-checked packages.
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          cache: false

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish: pnpm run release
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
